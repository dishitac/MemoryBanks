[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybank"
version = "0.1.0"
description = "MemoryBank: governed shared memory for purchasing agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.7",
    "certifi>=2024.2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "voyageai>=0.3",
    "httpx>=0.27",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["memorybank*", "purchasing_service*", "demo_app*"]

[tool.setuptools.package-data]
demo_app = ["page.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
